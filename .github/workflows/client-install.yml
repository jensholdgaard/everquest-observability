# Runs the member-facing Windows installer on a real Windows machine, end to end. The install path
# is the one thing here that cannot be tested from the maintainer's Linux box, and it is the first
# thing every guild member touches - so it gets its own CI.
name: client installer (Windows)

on:
  push:
    paths:
      - 'client/windows/**'
      - '.github/workflows/client-install.yml'
  pull_request:
    paths:
      - 'client/windows/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse (catches syntax errors before anything runs)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./client/windows/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "install.ps1 parses clean."

      - name: Install (dummy token, no EQ folder present)
        shell: pwsh
        run: |
          ./client/windows/install.ps1 -Token ci-dummy-token -NoZeal `
            -Endpoint http://127.0.0.1:9/v1/metrics -TracesEndpoint http://127.0.0.1:9/v1/traces

      - name: Verify the install landed
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'eq-otel'
          if (-not (Test-Path (Join-Path $dir 'otelcol-contrib.exe'))) { throw "collector exe missing" }
          if (-not (Test-Path (Join-Path $dir 'config.yaml'))) { throw "config missing" }
          if (-not (Get-ScheduledTask -TaskName EQ-OTel-Collector -ErrorAction SilentlyContinue)) {
            throw "logon task missing"
          }
          # The receiver Zeal posts to must actually accept a connection.
          $c = New-Object System.Net.Sockets.TcpClient
          $c.Connect('127.0.0.1', 4318); $c.Close()
          Write-Host "collector exe, config, logon task and 127.0.0.1:4318 all present."

      - name: Accept an OTLP payload (the exact shape Zeal posts)
        shell: pwsh
        run: |
          $body = @{
            resourceMetrics = @(@{
              resource = @{ attributes = @(@{ key = 'service.name'; value = @{ stringValue = 'everquest' } }) }
              scopeMetrics = @(@{
                metrics = @(@{
                  name = 'eq.combat.damage'
                  sum = @{
                    aggregationTemporality = 2
                    isMonotonic = $true
                    dataPoints = @(@{
                      asInt = '42'
                      timeUnixNano = '1700000000000000000'
                      startTimeUnixNano = '1700000000000000000'
                      attributes = @(@{ key = 'eq.zone.name'; value = @{ stringValue = 'Netherbian Lair' } })
                    })
                  }
                })
              })
            })
          } | ConvertTo-Json -Depth 20
          $r = Invoke-WebRequest -UseBasicParsing -Method POST -Uri http://127.0.0.1:4318/v1/metrics `
                 -ContentType 'application/json' -Body $body
          if ($r.StatusCode -ne 200) { throw "collector rejected the payload: $($r.StatusCode)" }
          Write-Host "collector accepted an OTLP/HTTP JSON metrics payload (200)."

      - name: Install Zeal.asi into a (fake) EverQuest folder
        shell: pwsh
        run: |
          # This is the step that writes into a member's game folder, so it gets covered too:
          # an existing Zeal.asi must be backed up, and what lands must be a real 32-bit PE image.
          $eq = Join-Path $env:RUNNER_TEMP 'EverQuest'
          New-Item -ItemType Directory -Force -Path $eq | Out-Null
          Set-Content -Path (Join-Path $eq 'eqgame.exe') -Value 'stand-in for the game'
          Set-Content -Path (Join-Path $eq 'Zeal.asi')   -Value 'stand-in for the previous Zeal'
          ./client/windows/install.ps1 -Token ci-dummy-token -EqDir $eq `
            -Endpoint http://127.0.0.1:9/v1/metrics -TracesEndpoint http://127.0.0.1:9/v1/traces
          if (-not (Get-ChildItem $eq -Filter 'Zeal.asi.bak-*')) {
            throw "the existing Zeal.asi was not backed up"
          }
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $eq 'Zeal.asi'))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "installed Zeal.asi is not a PE image" }
          if ($bytes.Length -lt 1MB) { throw "installed Zeal.asi looks truncated ($($bytes.Length) bytes)" }
          Write-Host "Zeal.asi installed ($([math]::Round($bytes.Length/1MB,1)) MB PE image), old one backed up."

      - name: Reject a folder that is not EverQuest
        shell: pwsh
        run: |
          $bogus = Join-Path $env:RUNNER_TEMP 'NotEverQuest'
          New-Item -ItemType Directory -Force -Path $bogus | Out-Null
          try {
            ./client/windows/install.ps1 -Token ci-dummy-token -EqDir $bogus
            throw "installer accepted a folder with no eqgame.exe"
          } catch {
            if ($_.Exception.Message -notlike "*eqgame.exe*") { throw }
            Write-Host "refused a non-EverQuest folder, as it should."
          }

      - name: Re-run install (must be idempotent)
        shell: pwsh
        run: ./client/windows/install.ps1 -Token ci-dummy-token-2 -NoZeal

      - name: Uninstall leaves nothing behind
        shell: pwsh
        run: |
          ./client/windows/install.ps1 -Uninstall
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'eq-otel')) { throw "install dir survived uninstall" }
          if (Get-ScheduledTask -TaskName EQ-OTel-Collector -ErrorAction SilentlyContinue) {
            throw "logon task survived uninstall"
          }
          Write-Host "uninstall is clean."

  # Members run Windows PowerShell 5.1 (what "powershell" opens), not pwsh 7. The two differ in ways
  # that break this script - 5.1's Set-Content -Encoding UTF8 writes a BOM that Go's YAML parser
  # rejects - and a pwsh-only matrix cannot see any of it.
  smoke-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Windows PowerShell 5.1 reads a BOM-less .ps1 as Windows-1252, so any non-ASCII byte in the
      # file (an em dash in a comment is enough) turns into mojibake and the parse fails outright.
      # The irm one-liner is decoded as UTF-8 by the HTTP layer and survives, which is exactly why
      # this only bites members who save the file and run it with -File.
      - name: install.ps1 must be pure ASCII
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path ./client/windows/install.ps1))
          $bad = $bytes | Where-Object { $_ -gt 127 }
          if ($bad) { throw "install.ps1 contains $($bad.Count) non-ASCII byte(s) - PS 5.1 will fail to parse it" }
          Write-Host "install.ps1 is pure ASCII."

      - name: Install under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\client\windows\install.ps1 -Token ci-dummy-token -NoZeal `
            -Endpoint http://127.0.0.1:9/v1/metrics -TracesEndpoint http://127.0.0.1:9/v1/traces

      - name: config.yaml must have no UTF-8 BOM
        shell: powershell
        run: |
          $cfg = Join-Path $env:LOCALAPPDATA 'eq-otel\config.yaml'
          $bytes = [System.IO.File]::ReadAllBytes($cfg)
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "config.yaml starts with a UTF-8 BOM - the collector will reject it"
          }
          Write-Host "config.yaml is BOM-free under PS 5.1."

      - name: Collector accepts a payload, then uninstall
        shell: powershell
        run: |
          $c = New-Object System.Net.Sockets.TcpClient
          $c.Connect('127.0.0.1', 4318); $c.Close()
          .\client\windows\install.ps1 -Uninstall
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'eq-otel')) { throw "install dir survived uninstall" }
          Write-Host "PS 5.1 install/uninstall cycle is clean."

  # The no-autostart path: no scheduled task at all, a launcher you start yourself.
  smoke-noautostart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install without autostart
        shell: pwsh
        run: |
          ./client/windows/install.ps1 -Token ci-dummy-token -NoZeal -NoAutostart `
            -Endpoint http://127.0.0.1:9/v1/metrics -TracesEndpoint http://127.0.0.1:9/v1/traces
          $dir = Join-Path $env:LOCALAPPDATA 'eq-otel'
          if (-not (Test-Path (Join-Path $dir 'run-otelcol.bat'))) { throw "launcher not written" }
          if (Get-ScheduledTask -TaskName EQ-OTel-Collector -ErrorAction SilentlyContinue) {
            throw "-NoAutostart still registered a scheduled task"
          }
          if (Get-Process otelcol-contrib -ErrorAction SilentlyContinue) {
            throw "-NoAutostart started the collector anyway"
          }
          Write-Host "no task, no running process, launcher present."

      - name: The launcher actually starts the collector
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'eq-otel'
          Start-Process -FilePath (Join-Path $dir 'run-otelcol.bat') -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..25) {
            try { $c = New-Object System.Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 4318); $c.Close(); $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw "run-otelcol.bat did not bring the collector up" }
          Write-Host "run-otelcol.bat works."
          ./client/windows/install.ps1 -Uninstall
