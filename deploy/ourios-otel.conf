# Drop-in for ourios.service (2026-09-06): Ourios instruments itself with the OTel
# SDK and reads the universal OTEL_* variables. Its exporter is OTLP/gRPC, which
# Prometheus does not accept directly, so it goes through the gateway's localhost
# gRPC listener (metrics -> Prometheus, traces -> Jaeger). Logs are off: Ourios
# writes them to stderr, and the gateway's journald receiver already ships those.
# Left unset, the SDK default endpoint is localhost:4317 -- Ourios' own receiver.
# Ourios sets its own service.name ("ourios-server") in code; OTEL_SERVICE_NAME is ignored.
[Service]
Environment=OTEL_RESOURCE_ATTRIBUTES=service.instance.id=eq-perses
Environment=OTEL_EXPORTER_OTLP_PROTOCOL=grpc
Environment=OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4321
Environment=OTEL_LOGS_EXPORTER=none
Environment=OTEL_METRIC_EXPORT_INTERVAL=30000
Environment=OTEL_TRACES_SAMPLER=parentbased_traceidratio
Environment=OTEL_TRACES_SAMPLER_ARG=0.25
