# Alerting rules for the box. Every rule here is `severity: critical`, deliberately
# (2026-09-13): the set had grown to 13 warnings that restated what a dashboard
# already showed, and a channel of warnings is a channel nobody reads - which is how
# Ourios refused every write for nine hours on 2026-09-11 while its only signal was a
# warning. If a rule does not warrant stopping what you are doing, it belongs on the
# Infrastructure dashboard, not here. Headroom (CPU, memory, disk below 95 %), unit
# restarts and journal error bursts all moved there.
groups:
  - name: eq-perses
    rules:
      - alert: CollectorSilent
        expr: absent_over_time(system_memory_utilization_ratio[5m])
        for: 2m
        labels: { team: vm, severity: critical }
        annotations:
          summary: No host metrics for 5 minutes
          description: The gateway collector stopped reporting the box. Prometheus is alive (or this could not fire), so it is the collector - systemctl status eq-gateway.

      - alert: UnitDown
        # The daemons a member depends on; the bot has its own rule. Timer-driven and
        # oneshot units are not listed, they are inactive by design.
        expr: systemd_unit_state{systemd_unit_active_state="active", systemd_unit_name=~"(caddy|perses|prometheus|alertmanager|jaeger|ourios|eq-gateway|fail2ban|ssh)\\.service"} == 0
        for: 3m
        labels: { team: vm, severity: critical }
        annotations:
          summary: "{{ $labels.systemd_unit_name }} is not active"
          description: "systemd reports {{ $labels.systemd_unit_name }} not active for 3 minutes. journalctl -u {{ $labels.systemd_unit_name }} -n 50"



      - alert: DiskAlmostFull
        expr: max(system_filesystem_utilization_ratio) > 0.95
        for: 5m
        labels: { team: vm, severity: critical }
        annotations:
          summary: "Root filesystem {{ $value | humanizePercentage }} full"
          description: Writes fail soon - the ledger's WAL among them.


      # Ourios wedges: a transient object-store outage closes its ingest path and it
      # never reopens without a restart (2026-09-11 and again 2026-09-12, upstream
      # issue #791). Both times the only warning was CollectorQueueBackedUp below,
      # which is the collector's buffer filling *as a consequence* - 40 minutes late
      # the second time, and nine hours of logs were already gone the first. This
      # names the cause: Ourios is taking nothing while the collector is failing to
      # hand it anything. Either half alone is ambiguous (a quiet box ingests
      # nothing; a blip fails a send), together they are not.

      - alert: OuriosNotIngesting
        expr: |
          sum(rate(ourios_ingest_records_total[10m])) == 0
          and on()
          sum(rate(otelcol_exporter_send_failed_log_records_total[10m])) > 0
        for: 5m
        labels: { team: vm, severity: critical }
        annotations:
          summary: Ourios is accepting no logs while the collector has some to send
          description: >-
            Every log post is being refused, so journal lines and the bot's own records are
            being dropped. Queries keep working, which is what makes this easy to miss.
            Check with a real payload - `curl -s -o /dev/null -w '%{http_code}' -X POST
            http://127.0.0.1:4318/v1/logs -H 'x-ourios-tenant: eq-perses' -H 'content-type:
            application/json' -d '{"resourceLogs":[]}'` answers 200 even when wedged, so send
            actual records. `systemctl restart ourios` clears it, then restart eq-gateway to
            drain its queue.


      - alert: CollectorRefusing
        expr: sum(rate(otelcol_receiver_refused_metric_points_total[10m])) + sum(rate(otelcol_receiver_refused_spans_total[10m])) + sum(rate(otelcol_receiver_refused_log_records_total[10m])) > 0
        for: 10m
        labels: { team: vm, severity: critical }
        annotations:
          summary: Gateway refusing data
          description: The memory limiter is pushing back; members' clients retry but a sustained refusal loses raid data.

      - alert: NotificationsFailing
        # Alertmanager's own counters, scraped by the gateway. If Discord rejects one channel's
        # webhook this still reaches the other; if both are gone, Healthchecks' heartbeat is
        # the only voice left, and this alert waits in Alertmanager until a channel returns.
        expr: sum(increase(alertmanager_notifications_failed_total[30m])) > 0
        labels: { team: vm, severity: critical }
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} Discord notification(s) failed in 30 minutes"
          description: journalctl -u alertmanager shows the response; a deleted or moved webhook is the usual cause.

      - alert: AlertmanagerConfigBroken
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels: { team: vm, severity: critical }
        annotations:
          summary: Alertmanager is running on its previous config
          description: The last reload failed; amtool check-config /etc/alertmanager/alertmanager.yml says why.


