# Installed at /etc/systemd/system/jaeger.service.d/memory.conf
#
# After the 2026-09-14 reset Jaeger came up at 1975 MB RSS on a 3819 MB box:
# 1205 MB of heap and 330 MB of memory-mapped Badger files, for 836 MB of
# traces on disk. Nothing bounded it. Together with Ourios's 1536 MB cap
# (ourios memory.conf) that overcommits the box, which is exactly how it
# livelocked this afternoon.
#
# GOMEMLIMIT is the knob that matters for a Go service: past it the runtime
# collects aggressively and shrinks Badger's caches on its own, with no kill
# involved. MemoryHigh throttles and reclaims the mapped files before that,
# and MemoryMax is the backstop that ensures a runaway lands on Jaeger - the
# most expendable thing on the box, 72 h of debugging traces - rather than on
# the bot. Restart=always is already in the unit.
#
# Budget: Ourios 1536 + Jaeger 1536 + bot ~300 + the rest ~300 = 3.6 GB at
# worst case, and both caps only bite in a failure; at rest they sit near
# 700 + 1000. The durable fix is a shorter Badger TTL or a box with more than
# 4 GB, not more caps.
[Service]
Environment=GOMEMLIMIT=1000MiB
MemoryHigh=1280M
MemoryMax=1536M
