# Drop-in for eq-gateway.service (2026-10-11): the Dash0 token for Ourios's own telemetry
# (collector/gateway.yaml, bearertokenauth/dash0). Encrypted at rest with the host key, like the
# bot token (harden.sh); systemd decrypts it into /run/credentials/eq-gateway.service/ for this
# unit only. Installed by install-dash0.sh, which writes the .cred first: a drop-in naming a
# credential that does not exist stops the unit from starting.
[Service]
LoadCredentialEncrypted=dash0_token:/etc/eq-otel/dash0_token.cred
