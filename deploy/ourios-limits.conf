# Installed at /etc/systemd/system/ourios.service.d/limits.conf
#
# Ourios does not close inbound connections after the client goes away. They
# sit in CLOSE-WAIT on its own listener - the peers are 127.0.0.1, the OTLP
# collector on this box, not the object store. Under light load the count
# cycles: it climbs past 1900 in about a minute, ingest stops answering
# entirely, then the whole set is dropped and it recovers, roughly every two
# minutes. Same PID throughout; it is not crashing.
#
# systemd's default soft limit is 1024 no matter how high the hard limit is,
# and that is the number that binds. Every cycle crossed it, and once the
# ceiling is reached the process cannot make the progress needed to clean up:
# ingest answers 503, the object-store client reports "transport error of kind
# Connect" because it cannot get a socket at all, and nothing is logged about
# the real cause because Ourios never checks for EMFILE. Only a restart clears
# it. Measured 2026-09-14: 912 descriptors held, 849 in CLOSE-WAIT, and about
# 25 minutes from a clean start to wedged.
#
# 65536 does not fix the bug. It stops the cycle from reaching the ceiling, so
# a permanent wedge becomes a recurring stall during each burst - bad, but
# survivable through a raid. The object store itself is healthy and not
# involved (200s at ~50 ms, 2 ms ping). Remove this once the listener is fixed
# upstream (jensholdgaard/ourios#791).
[Service]
LimitNOFILE=65536
