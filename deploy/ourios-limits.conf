# Installed at /etc/systemd/system/ourios.service.d/limits.conf
#
# Ourios leaks outbound connections to the object store. The remote closes its
# side, Ourios never calls close(), and the descriptor is held forever.
# Measured 2026-09-14 by mapping every /proc/<pid>/fd socket inode through
# /proc/net/tcp and tcp6: 669 of 694 held sockets in CLOSE_WAIT, 676 of them to
# fsn1.your-objectstorage.com:443, against 22 doing actual work. Note `ss` does
# not show most of them - it listed 40 - so the fd table is the only honest
# count.
#
# They accumulate until the process hits its ceiling, after which it cannot
# open a socket for anything: ingest answers 503, the object-store client
# reports "transport error of kind Connect" about a bucket that answers in
# 50 ms, and nothing is logged because Ourios never checks for EMFILE. Only a
# restart clears it, and at the 1024 default a restart bought about 25 minutes.
#
# systemd's soft limit is 1024 regardless of the hard limit the unit declares,
# and the soft limit is what binds. 65536 does not slow the leak at all; it
# raises the ceiling far enough that the process survives to the next restart
# instead of wedging overnight. Remove once the leak is fixed upstream
# (jensholdgaard/ourios#791).
[Service]
LimitNOFILE=65536
