# Installed at /etc/systemd/system/ourios.service.d/limits.conf
#
# Ourios leaks sockets: they are left in CLOSE-WAIT after the object store
# closes its side, and the process never calls close(). They accumulate until
# it reaches its file-descriptor ceiling, after which no new connection can be
# opened — the object-store client reports "transport error of kind Connect",
# ingest answers 503, and the server logs nothing about itself because it does
# not notice. Only a restart clears it. Measured 2026-09-14: 849 of 912
# descriptors in CLOSE-WAIT against the 1024 default, roughly 25 minutes from
# a clean start to wedged under this guild's load.
#
# systemd's default soft limit is 1024 no matter how high the hard limit is,
# and that is the number that binds. Raising it does not fix the leak; it
# turns "wedges every half hour" into "wedges every few weeks", which is the
# difference between losing a raid night and not. Remove this once the leak
# is fixed upstream (jensholdgaard/ourios#791).
[Service]
LimitNOFILE=65536
