# Drop-in for eq-gateway.service (2026-09-06): what the VM receivers need beyond
# harden.conf. The journal is readable by the systemd-journal group; the journald
# receiver keeps its cursor under /var/lib/eq-gateway, which StateDirectory creates
# and leaves writable through ProtectSystem=strict.
[Service]
SupplementaryGroups=systemd-journal
StateDirectory=eq-gateway
