# Installed at /etc/systemd/system/ourios.service.d/compaction.conf
#
# The packaged unit asks for a compaction sweep every 30 seconds. Here a sweep
# takes about 260 seconds and returns "noop" - nine consecutive sweeps touched
# not one partition, against a backlog of 517 (jensholdgaard/ourios#807). With
# tokio's Delay tick behaviour the next sweep is scheduled only once the last
# returns, so at a 30 s interval they run back to back forever, holding a
# blocking-pool thread and hammering the object store to achieve nothing.
#
# To be clear about what this does not do: it does not fix the descriptor leak
# in ourios#791. I spaced the interval expecting it would, then measured the
# quiet window with no sweep running and watched descriptors climb past 1200
# anyway. The leak is in the object-store client and is independent of this.
#
# What it does earn is the continuous pointless I/O stopping. 1800 loses
# nothing, because the sweeps are no-ops and the backlog does not drain at 30 s
# either. Revert to the packaged interval once compaction actually compacts.
[Service]
Environment=OURIOS_COMPACTION_INTERVAL_SECS=1800
