# Installed at /etc/systemd/system/ourios.service.d/memory.conf
#
# Ourios leaks connections to the object store (jensholdgaard/ourios#791) and
# the memory behind them is never returned - it was measured at 2566 MB RSS
# with only 41 descriptors open, on a box with 3819 MB and no swap. Raising
# LimitNOFILE (limits.conf) removed the one thing that had been capping that
# growth by accident: at the old 1024 ceiling it wedged, which was bad, but it
# stopped growing, which kept the box alive. Without the cap it starved
# everything: load 32 on two cores, 94 MB free, the Discord bot losing DNS and
# dropping its gateway session.
#
# MemoryMax makes the failure land on Ourios instead of the box. Past the cap
# the kernel kills Ourios alone, systemd restarts it, and the bot, Prometheus
# and Caddy never notice. MemoryHigh throttles it first so the kill is the
# exception. 1536 MB is the top of its healthy range with room to spare, and
# leaves 2.2 GB for everything else on the box. Remove alongside limits.conf
# once the leak is fixed upstream.
[Service]
MemoryHigh=1280M
MemoryMax=1536M
Restart=on-failure
RestartSec=5
