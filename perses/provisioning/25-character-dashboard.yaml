# Generated split of the original single dashboard: one purpose per page.
apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: eq-character
  project: everquest
spec:
  display:
    name: EverQuest Character
  duration: 15m
  refreshInterval: 10s
  variables:
  - kind: ListVariable
    spec:
      name: zone
      display:
        name: Zone
      allowAllValue: true
      allowMultiple: false
      customAllValue: .+
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_zone_name
          matchers:
          - everquest_combat_damage_total
  panels:
    attack:
      kind: Panel
      spec:
        display:
          name: Attack rating
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: everquest_character_attack_ratio{everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}
                seriesNameFormat: '{{service_instance_id}}'
    haste:
      kind: Panel
      spec:
        display:
          name: Haste %
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: everquest_character_haste_percent{everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}
                seriesNameFormat: '{{service_instance_id}}'
    incoming:
      kind: Panel
      spec:
        display:
          name: Damage taken
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="incoming",
                  everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}[30s])) > 0
                seriesNameFormat: '{{service_instance_id}}'
  layouts:
  - kind: Grid
    spec:
      display:
        title: Character
      items:
      - x: 0
        y: 0
        width: 8
        height: 8
        content:
          $ref: '#/spec/panels/attack'
      - x: 8
        y: 0
        width: 8
        height: 8
        content:
          $ref: '#/spec/panels/haste'
      - x: 16
        y: 0
        width: 8
        height: 8
        content:
          $ref: '#/spec/panels/incoming'
