# Generated split of the original single dashboard: one purpose per page.
apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: eq-raid
  project: everquest
spec:
  display:
    name: EverQuest Raid Targets
  duration: 7d
  refreshInterval: 1m
  panels:
    raid_tod:
      kind: Panel
      spec:
        display:
          name: Time of death (hours ago)
          description: 'Captured from the server''s lockout notice, which is sent at the kill (NPC::CreateCorpse), not at
            looting - so nobody has to post the TOD by hand.

            '
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: (time() - max by (everquest_raid_target) (max_over_time(everquest_raid_kill_timestamp[7d]))) / 3600
                seriesNameFormat: '{{everquest_raid_target}}'
    raid_lockouts:
      kind: Panel
      spec:
        display:
          name: Lockout remaining (hours)
          description: Counts down to the instant the lockout expires; drops off the list once it has.
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: (max by (everquest_raid_target) (max_over_time(everquest_raid_lockout_expiry[7d])) - time()) / 3600
                  > 0
                seriesNameFormat: '{{everquest_raid_target}}'
  layouts:
  - kind: Grid
    spec:
      display:
        title: Raid targets
      items:
      - x: 0
        y: 0
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/raid_tod'
      - x: 12
        y: 0
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/raid_lockouts'
