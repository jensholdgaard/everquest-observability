# Jaeger holds the fight/zone spans. Proxied through Perses (same-origin) so the browser never
# talks to Jaeger directly — Jaeger itself stays bound to localhost on the VM.
apiVersion: perses.dev/v1alpha1
kind: GlobalDatasource
metadata:
  name: jaeger
spec:
  display:
    name: Jaeger (EverQuest fights)
  default: false
  plugin:
    kind: JaegerDatasource
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: http://127.0.0.1:16686
          allowedEndpoints:
            - endpointPattern: /api/services
              method: GET
            - endpointPattern: /api/services/([a-zA-Z0-9_.-]+)/operations
              method: GET
            - endpointPattern: /api/traces
              method: GET
            - endpointPattern: /api/traces/([a-zA-Z0-9]+)
              method: GET
