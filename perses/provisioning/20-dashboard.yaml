apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: eq-dps
  project: everquest
spec:
  display:
    name: EverQuest DPS
  duration: 15m
  refreshInterval: 10s

  panels:
    dps_bars:
      kind: Panel
      spec:
        display:
          name: DPS meter (by source)
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'topk(20, sum by (eq_combat_source) (rate(eq_combat_damage_total{eq_combat_direction="outgoing", eq_combat_source_type="player"}[60s])) > 0)'
                  seriesNameFormat: '{{eq_combat_source}}'

    dps_by_source:
      kind: Panel
      spec:
        display:
          name: DPS over time (by source)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (eq_combat_source) (rate(eq_combat_damage_total{eq_combat_direction="outgoing", eq_combat_source_type="player"}[30s])) > 0'
                  seriesNameFormat: '{{eq_combat_source}}'

    damage_by_type:
      kind: Panel
      spec:
        display:
          name: DPS by damage type
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (eq_combat_damage_type) (rate(eq_combat_damage_total{eq_combat_direction="outgoing", eq_combat_source_type="player"}[30s]))'
                  seriesNameFormat: '{{eq_combat_damage_type}}'

    total_damage:
      kind: Panel
      spec:
        display:
          name: Total damage dealt (cumulative)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (eq_combat_source) (eq_combat_damage_total{eq_combat_direction="outgoing", eq_combat_source_type="player"})'
                  seriesNameFormat: '{{eq_combat_source}}'

    attack:
      kind: Panel
      spec:
        display:
          name: Attack rating (you)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'eq_character_attack_ratio'
                  seriesNameFormat: '{{service_instance_id}}'

    haste:
      kind: Panel
      spec:
        display:
          name: Haste % (you)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'eq_character_haste_percent'
                  seriesNameFormat: '{{service_instance_id}}'

    incoming:
      kind: Panel
      spec:
        display:
          name: Damage taken (incoming)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum(rate(eq_combat_damage_total{eq_combat_direction="incoming"}[30s]))'
                  seriesNameFormat: 'damage taken'

    heal_bars:
      kind: Panel
      spec:
        display:
          name: Healing done (HPS meter)
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'topk(20, sum by (eq_combat_source) (rate(eq_combat_heal_total{eq_combat_direction="outgoing"}[60s])) > 0)'
                  seriesNameFormat: '{{eq_combat_source}}'

    heal_over_time:
      kind: Panel
      spec:
        display:
          name: Healing over time
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (eq_combat_source) (rate(eq_combat_heal_total{eq_combat_direction="outgoing"}[30s])) > 0'
                  seriesNameFormat: '{{eq_combat_source}}'


  layouts:
    - kind: Grid
      spec:
        display:
          title: DPS
        items:
          - x: 0
            y: 0
            width: 24
            height: 10
            content: { $ref: '#/spec/panels/dps_bars' }
          - x: 0
            y: 10
            width: 24
            height: 8
            content: { $ref: '#/spec/panels/dps_by_source' }
          - x: 0
            y: 18
            width: 12
            height: 7
            content: { $ref: '#/spec/panels/damage_by_type' }
          - x: 12
            y: 18
            width: 12
            height: 7
            content: { $ref: '#/spec/panels/total_damage' }
          - x: 0
            y: 25
            width: 8
            height: 7
            content: { $ref: '#/spec/panels/attack' }
          - x: 8
            y: 25
            width: 8
            height: 7
            content: { $ref: '#/spec/panels/haste' }
          - x: 16
            y: 25
            width: 8
            height: 7
            content: { $ref: '#/spec/panels/incoming' }
          - x: 0
            y: 32
            width: 12
            height: 8
            content: { $ref: '#/spec/panels/heal_bars' }
          - x: 12
            y: 32
            width: 12
            height: 8
            content: { $ref: '#/spec/panels/heal_over_time' }
