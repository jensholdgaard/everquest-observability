apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: eq-dps
  project: everquest
spec:
  display:
    name: EverQuest DPS
  duration: 15m
  refreshInterval: 10s

  variables:
    - kind: ListVariable
      spec:
        name: zone
        display:
          name: Zone
        allowAllValue: true
        allowMultiple: false
        customAllValue: ".+"
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: everquest_zone_name
            matchers:
              - 'everquest_combat_damage_total'

  panels:
    dps_bars:
      kind: Panel
      spec:
        display:
          name: DPS meter (by source)
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'topk(20, sum by (everquest_combat_source) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing", everquest_combat_source_type="player", everquest_zone_name=~"$zone"}[60s])) > 0)'
                  seriesNameFormat: '{{everquest_combat_source}}'

    dps_by_source:
      kind: Panel
      spec:
        display:
          name: DPS history (by source)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (everquest_combat_source) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing", everquest_combat_source_type="player", everquest_zone_name=~"$zone"}[30s])) > 0'
                  seriesNameFormat: '{{everquest_combat_source}}'

    damage_by_type:
      kind: Panel
      spec:
        display:
          name: DPS by damage type
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (everquest_combat_damage_type) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing", everquest_combat_source_type="player", everquest_zone_name=~"$zone"}[30s]))'
                  seriesNameFormat: '{{everquest_combat_damage_type}}'

    total_damage:
      kind: Panel
      spec:
        display:
          name: Total damage dealt (cumulative)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (everquest_combat_source) (everquest_combat_damage_total{everquest_combat_direction="outgoing", everquest_combat_source_type="player", everquest_zone_name=~"$zone"})'
                  seriesNameFormat: '{{everquest_combat_source}}'

    attack:
      kind: Panel
      spec:
        display:
          name: Attack rating (you)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'everquest_character_attack_ratio{everquest_zone_name=~"$zone"}'
                  seriesNameFormat: '{{service_instance_id}}'

    haste:
      kind: Panel
      spec:
        display:
          name: Haste % (you)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'everquest_character_haste_percent{everquest_zone_name=~"$zone"}'
                  seriesNameFormat: '{{service_instance_id}}'

    incoming:
      kind: Panel
      spec:
        display:
          name: Damage taken (incoming)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum(rate(everquest_combat_damage_total{everquest_combat_direction="incoming", everquest_zone_name=~"$zone"}[30s]))'
                  seriesNameFormat: 'damage taken'

    heal_bars:
      kind: Panel
      spec:
        display:
          name: Healing done (HPS meter)
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'topk(20, sum by (everquest_combat_source) (rate(everquest_combat_heal_total{everquest_combat_direction="outgoing", everquest_zone_name=~"$zone"}[60s])) > 0)'
                  seriesNameFormat: '{{everquest_combat_source}}'

    heal_over_time:
      kind: Panel
      spec:
        display:
          name: Healing history
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (everquest_combat_source) (rate(everquest_combat_heal_total{everquest_combat_direction="outgoing", everquest_zone_name=~"$zone"}[30s])) > 0'
                  seriesNameFormat: '{{everquest_combat_source}}'


    damage_by_target:
      kind: Panel
      spec:
        display:
          name: DPS by target (what we're killing)
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'topk(15, sum by (everquest_combat_target) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing", everquest_combat_source_type="player", everquest_zone_name=~"$zone"}[60s])) > 0)'
                  seriesNameFormat: '{{everquest_combat_target}}'


  layouts:
    - kind: Grid
      spec:
        display:
          title: DPS
        items:
          - x: 0
            y: 0
            width: 24
            height: 10
            content: { $ref: '#/spec/panels/dps_bars' }
          - x: 0
            y: 10
            width: 24
            height: 8
            content: { $ref: '#/spec/panels/dps_by_source' }
          - x: 0
            y: 18
            width: 12
            height: 7
            content: { $ref: '#/spec/panels/damage_by_type' }
          - x: 12
            y: 18
            width: 12
            height: 7
            content: { $ref: '#/spec/panels/total_damage' }
          - x: 0
            y: 25
            width: 8
            height: 7
            content: { $ref: '#/spec/panels/attack' }
          - x: 8
            y: 25
            width: 8
            height: 7
            content: { $ref: '#/spec/panels/haste' }
          - x: 16
            y: 25
            width: 8
            height: 7
            content: { $ref: '#/spec/panels/incoming' }
          - x: 0
            y: 32
            width: 12
            height: 8
            content: { $ref: '#/spec/panels/heal_bars' }
          - x: 12
            y: 32
            width: 12
            height: 8
            content: { $ref: '#/spec/panels/heal_over_time' }
          - x: 0
            y: 40
            width: 24
            height: 8
            content: { $ref: '#/spec/panels/damage_by_target' }
