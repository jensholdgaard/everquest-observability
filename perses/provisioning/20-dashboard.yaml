# One page, with each section collapsible. NOTE: Perses queries collapsed panels too, so every
# viewer pays for all panels on every refresh - keep the refresh interval modest.
apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: eq-dps
  project: everquest
spec:
  display:
    name: EverQuest
  duration: 1h
  refreshInterval: 5s
  variables:
  - kind: ListVariable
    spec:
      name: group
      display:
        name: Group (leader)
      allowAllValue: true
      allowMultiple: false
      customAllValue: .*
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_group_leader
          matchers:
          - everquest_group_member
      defaultValue: $__all
  - kind: ListVariable
    spec:
      name: zone
      display:
        name: Zone
      allowAllValue: true
      allowMultiple: false
      customAllValue: .*
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_zone_name
          matchers:
          - everquest_combat_damage_total
      defaultValue: $__all
  - kind: ListVariable
    spec:
      name: player
      display:
        name: Player
      allowAllValue: true
      allowMultiple: true
      customAllValue: .*
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_combat_source
          matchers:
          - everquest_combat_damage_total{everquest_combat_source_type="player"}
      defaultValue: $__all
  - kind: ListVariable
    spec:
      name: character
      display:
        name: Character (tank)
      allowAllValue: true
      allowMultiple: false
      customAllValue: .*
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_combat_source
          matchers:
          - everquest_combat_heal_total{everquest_combat_direction="incoming"}
      defaultValue: $__all
  - kind: TextVariable
    spec:
      name: fight
      display:
        name: Fight (trace id)
        description: Click a row in the fights table to fill this in, or paste a trace id.
      value: ''
  - kind: ListVariable
    spec:
      name: target
      display:
        name: Target (mob)
      allowAllValue: true
      allowMultiple: false
      customAllValue: .*
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_combat_target
          matchers:
          - everquest_combat_damage_total{everquest_combat_direction="outgoing", everquest_combat_source_type="player"}
      defaultValue: $__all
  panels:
    stat_metric_overflow:
      kind: Panel
      spec:
        display:
          name: Data loss (overflow)
          description: 'Should always be 0. The OpenTelemetry SDK tracks at most 2000 distinct label
            combinations per metric; past that it lumps further measurements into one bucket and discards
            their labels. Totals stay correct, but every panel that filters by target, source or damage
            type silently stops counting them - so this is the one number that says whether the rest of
            this dashboard can be trusted. If it is above 0, someone has fought more distinct mobs in one
            session than the client can track, and they should relog to reset it.'
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(count by (instance) ({otel_metric_overflow="true"})) or vector(0)
    stat_series_headroom:
      kind: Panel
      spec:
        display:
          name: Label combinations used
          description: 'Distinct label combinations the busiest client is tracking, against the SDK cap of
            2000. Roughly eight per distinct mob fought, so this climbs through a session and resets when
            the client restarts. Watch it approach the cap rather than waiting for data loss to appear.'
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max(count by (instance) (everquest_combat_damage_total))
    stat_group_dps:
      kind: Panel
      spec:
        display:
          name: Group DPS (live, 60s)
          description: 'A rolling 60-second rate - damage right now, not a fight result. This is NOT the DPS or
            SDPS column in eqlogparse: those divide a fight''s damage by the attacker''s engaged time or by the
            fight''s duration, while this divides by a fixed 60s window. It therefore reads higher than a parse
            during a burn and lower across a pull with pauses. Use it to watch a fight happening; use the
            per-fight panels to compare against a parse. Deduplicated: if several clients report the same
            attacker, the most complete single report is used rather than summing them.'
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(max by (everquest_combat_source) (sum by (everquest_combat_source, service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player",
                  everquest_combat_target=~"$target"}[60s]))))
    stat_top_dps:
      kind: Panel
      spec:
        display:
          name: Best player DPS (live, 60s)
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max(max by (everquest_combat_source) (sum by (everquest_combat_source, service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player",
                  everquest_combat_target=~"$target"}[60s]))))
    stat_taken:
      kind: Panel
      spec:
        display:
          name: Damage taken /s
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(rate(everquest_combat_damage_total{everquest_combat_direction="incoming", everquest_group_leader=~"$group",
                  everquest_zone_name=~"$zone"}[60s]))
    dps_bars:
      kind: Panel
      spec:
        display:
          name: DPS meter
          description: 'With a target selected, this is per-player DPS on that mob. Deduplicated: if several clients report
            the same attacker, the most complete single report is used rather than summing them.'
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: topk(20, max by (everquest_combat_source) (sum by (everquest_combat_source, service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player",
                  everquest_combat_target=~"$target"}[60s]))) > 0)
                seriesNameFormat: '{{everquest_combat_source}}'
    dps_table:
      kind: Panel
      spec:
        display:
          name: Leaderboard (DPS now / share of group)
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sort_desc(max by (everquest_combat_source) (sum by (everquest_combat_source, service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player",
                  everquest_combat_target=~"$target"}[60s]))) > 0)
                seriesNameFormat: '{{everquest_combat_source}}'
    dps_history:
      kind: Panel
      spec:
        display:
          name: DPS history
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max by (everquest_combat_source) (sum by (everquest_combat_source, service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player",
                  everquest_combat_target=~"$target"}[30s]))) > 0
                seriesNameFormat: '{{everquest_combat_source}}'
    damage_mix:
      kind: Panel
      spec:
        display:
          name: Damage mix (by type)
          description: One slice per damage type. 'melee' is the catch-all for a damage type the client sends with no specific
            classification; every other slice is a real distinction (hth is hand-to-hand, spell is direct spell damage, dot
            is a damage-over-time tick, damage_shield is your shield).
        plugin:
          kind: PieChart
          spec:
            radius: 70
            calculation: sum
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (everquest_combat_damage_type) (max by (everquest_combat_source, everquest_combat_damage_type)
                  (sum by (everquest_combat_source, everquest_combat_damage_type, service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player",
                  everquest_combat_target=~"$target"}[60s])))) > 0
                seriesNameFormat: '{{everquest_combat_damage_type}}'
    dps_by_target:
      kind: Panel
      spec:
        display:
          name: Damage by target
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: topk(15, sum by (everquest_combat_target) (max by (everquest_combat_source, everquest_combat_target)
                  (sum by (everquest_combat_source, everquest_combat_target, service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player",
                  everquest_combat_target=~"$target"}[60s])))) > 0)
                seriesNameFormat: '{{everquest_combat_target}}'
    stat_hps:
      kind: Panel
      spec:
        display:
          name: Healing received /s
          description: Healing landing on the group. This is measured from the RECEIVING client, because the server only messages
            the target of a heal (Mob::HealDamage sends YOU_HEALED to the target and nothing to the healer) - so healing per
            healer is not observable on this server at all. Averaged over 5 minutes, because healing is bursty - a 1-minute
            window reads zero between casts and looks broken.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(rate(everquest_combat_heal_total{everquest_combat_direction="incoming", everquest_group_leader=~"$group",
                  everquest_zone_name=~"$zone"}[60s]))
    heal_bars:
      kind: Panel
      spec:
        display:
          name: Healing received (per character)
          description: Who is being kept alive, and how hard.
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: topk(20, sum by (everquest_combat_source) (rate(everquest_combat_heal_total{everquest_combat_direction="incoming",
                  everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}[60s])) > 0)
                seriesNameFormat: '{{everquest_combat_source}}'
    heal_history:
      kind: Panel
      spec:
        display:
          name: Healing received over time
          description: The source label is the character who was healed - the heal message never names the healer.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (everquest_combat_source) (rate(everquest_combat_heal_total{everquest_combat_direction="incoming",
                  everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}[5m])) > 0
                seriesNameFormat: '{{everquest_combat_source}}'
    heal_total:
      kind: Panel
      spec:
        display:
          name: Healing received (dashboard window)
          description: Total hit points healed onto each character over the selected time range.
        plugin:
          kind: BarChart
          spec:
            calculation: sum
            sort: desc
            mode: value
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (everquest_combat_source) (increase(everquest_combat_heal_total{everquest_combat_direction="incoming",
                  everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}[$__range])) > 0
                seriesNameFormat: '{{everquest_combat_source}}'
    tank_healed:
      kind: Panel
      spec:
        display:
          name: Healing received (HP)
          description: 'Hit points healed onto this character over the dashboard range. This is EFFECTIVE healing: the server
            clamps the reported amount to the hit points actually missing (acthealed = maxhp - curhp), so overheal is already
            excluded - what you see is what landed.'
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(increase(everquest_combat_heal_total{everquest_combat_direction="incoming", everquest_combat_source=~"$character",
                  everquest_group_leader=~"$group"}[$__range]))
    tank_damaged:
      kind: Panel
      spec:
        display:
          name: Damage taken (HP)
          description: Hit points taken by this character over the same range.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(increase(everquest_combat_damage_total{everquest_combat_direction="incoming", everquest_combat_target=~"$character",
                  everquest_group_leader=~"$group"}[$__range]))
    tank_balance:
      kind: Panel
      spec:
        display:
          name: Healing received vs damage taken (HP/s)
          description: Healers keeping up when the healing line sits at or above the damage line.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(rate(everquest_combat_heal_total{everquest_combat_direction="incoming", everquest_combat_source=~"$character",
                  everquest_group_leader=~"$group"}[60s]))
                seriesNameFormat: healing received
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(rate(everquest_combat_damage_total{everquest_combat_direction="incoming", everquest_combat_target=~"$character",
                  everquest_group_leader=~"$group"}[60s]))
                seriesNameFormat: damage taken
    raid_tod:
      kind: Panel
      spec:
        display:
          name: Time of death (hours ago)
          description: 'Captured from the server''s lockout notice, which is sent at the kill (NPC::CreateCorpse), not at
            looting - so nobody has to post the TOD by hand.

            '
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: (time() - max by (everquest_raid_target) (max_over_time(everquest_raid_kill_timestamp_seconds[7d])))
                  / 3600
                seriesNameFormat: '{{everquest_raid_target}}'
    raid_lockouts:
      kind: Panel
      spec:
        display:
          name: Lockout remaining (hours)
          description: Counts down to the instant the lockout expires; drops off the list once it has.
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: (max by (everquest_raid_target) (max_over_time(everquest_raid_lockout_expiry_seconds[7d])) - time())
                  / 3600 > 0
                seriesNameFormat: '{{everquest_raid_target}}'
    stat_group_size:
      kind: Panel
      spec:
        display:
          name: Group size
          description: Members in the group, including anyone not running the DPS meter.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: count(count by (everquest_character_name) (everquest_group_member{everquest_group_leader=~"$group"}))
    stat_reporting:
      kind: Panel
      spec:
        display:
          name: Reporting damage
          description: 'Group members who produced damage in the last 5 minutes. Lower than group size means someone is not
            running the meter (or has it off) - which is the usual reason a group total looks too low.

            '
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: count(count by (everquest_combat_source) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group"}[5m]) > 0))
    group_roster:
      kind: Panel
      spec:
        display:
          name: Roster
          description: Everyone in the group, whether or not they report telemetry.
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max by (everquest_character_name) (everquest_group_member{everquest_group_leader=~"$group"})
                seriesNameFormat: '{{everquest_character_name}}'
    stat_collectors_online:
      kind: Panel
      spec:
        display:
          name: Collectors online
          description: Members whose collector has checked in within the last 5 minutes.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: count(group by (everquest_reporter) (otelcol_process_uptime_seconds_total))
    collector_status:
      kind: Panel
      spec:
        display:
          name: Collector last check-in (minutes ago)
          description: "One row per member who has ever reported. A climbing number means their collector is down or their\
            \ machine is off - not that they are idle.\n Looks back 6 hours: a collector silent longer than that has no row\
            \ at all, which is itself the answer."
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: (time() - max by (everquest_reporter) (max_over_time(timestamp(otelcol_process_uptime_seconds_total)[6h:5m])))
                  / 60
                seriesNameFormat: '{{everquest_reporter}}'
    client_builds:
      kind: Panel
      spec:
        display:
          name: Client build per member (last 24h)
          description: Zeal reports its release plus the build hash as service.version, so a feature that is missing for one
            member can be checked against the build they are actually running rather than the one they were asked to install.
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: count by (everquest_reporter, service_version) (count_over_time(everquest_combat_damage_total[24h]))
                seriesNameFormat: '{{everquest_reporter}} - {{service_version}}'
    attack:
      kind: Panel
      spec:
        display:
          name: Attack rating
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: everquest_character_attack_ratio{everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}
                seriesNameFormat: '{{service_instance_id}}'
    haste:
      kind: Panel
      spec:
        display:
          name: Haste %
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: everquest_character_haste_percent{everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}
                seriesNameFormat: '{{service_instance_id}}'
    incoming:
      kind: Panel
      spec:
        display:
          name: Damage taken
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (service_instance_id) (rate(everquest_combat_damage_total{everquest_combat_direction="incoming",
                  everquest_group_leader=~"$group", everquest_zone_name=~"$zone"}[30s])) > 0
                seriesNameFormat: '{{service_instance_id}}'
    fights_table:
      kind: Panel
      spec:
        display:
          name: Recent fights (click a row to load its timeline)
          description: 'Each fight is a span opened on first damage and closed by a kill message, 30s of inactivity, or zoning.
            Nested under the zone session it happened in.

            '
        plugin:
          kind: TraceTable
          spec:
            links:
              trace: ?var-fight=${traceId}&fight=${traceId}
        queries:
        - kind: TraceQuery
          spec:
            plugin:
              kind: JaegerTraceQuery
              spec:
                datasource:
                  kind: JaegerDatasource
                  name: jaeger
                service: everquest
                limit: 50
    fight_gantt:
      kind: Panel
      spec:
        display:
          name: Fight timeline
          description: "Gantt view of the selected fight \u2014 the zone session with its fights nested inside."
        plugin:
          kind: TracingGanttChart
          spec: {}
        queries:
        - kind: TraceQuery
          spec:
            plugin:
              kind: JaegerTraceQuery
              spec:
                datasource:
                  kind: JaegerDatasource
                  name: jaeger
                traceId: $fight
    lockout_bars:
      kind: Panel
      spec:
        display:
          name: Lockout remaining
          description: Share of each lockout still to run. Full bar = just killed, empty = about to lift. Green under a third
            remaining means it is nearly free to kill again.
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            thresholds:
              mode: percent
              defaultColor: '#4CAF50'
              steps:
              - value: 0.33
                color: '#FFC107'
              - value: 0.66
                color: '#F44336'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: clamp_min((max by (everquest_raid_target) (max_over_time(everquest_raid_lockout_expiry_seconds[14d]))
                  - time()) / (max by (everquest_raid_target) (max_over_time(everquest_raid_lockout_expiry_seconds[14d]))
                  - max by (everquest_raid_target) (max_over_time(everquest_raid_kill_timestamp_seconds[14d]))), 0) > 0
                seriesNameFormat: '{{everquest_raid_target}}'
