# Generated split of the original single dashboard: one purpose per page.
apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: eq-dps
  project: everquest
spec:
  display:
    name: EverQuest DPS
  duration: 15m
  refreshInterval: 10s
  variables:
  - kind: ListVariable
    spec:
      name: group
      display:
        name: Group (leader)
      allowAllValue: true
      allowMultiple: false
      customAllValue: .*
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_group_leader
          matchers:
          - everquest_group_member
  - kind: ListVariable
    spec:
      name: zone
      display:
        name: Zone
      allowAllValue: true
      allowMultiple: false
      customAllValue: .+
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_zone_name
          matchers:
          - everquest_combat_damage_total
  - kind: ListVariable
    spec:
      name: player
      display:
        name: Player
      allowAllValue: true
      allowMultiple: true
      customAllValue: .+
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          labelName: everquest_combat_source
          matchers:
          - everquest_combat_damage_total{everquest_combat_source_type="player"}
  panels:
    stat_group_dps:
      kind: Panel
      spec:
        display:
          name: Group DPS
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(rate(everquest_combat_damage_total{everquest_combat_direction="outgoing", everquest_combat_source_type="player",
                  everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player"}[60s]))
    stat_top_dps:
      kind: Panel
      spec:
        display:
          name: Best player DPS
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max(sum by (everquest_combat_source) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player"}[60s])))
    stat_taken:
      kind: Panel
      spec:
        display:
          name: Damage taken /s
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(rate(everquest_combat_damage_total{everquest_combat_direction="incoming", everquest_group_leader=~"$group",
                  everquest_zone_name=~"$zone"}[60s]))
    dps_bars:
      kind: Panel
      spec:
        display:
          name: DPS meter
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: topk(20, sum by (everquest_combat_source) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player"}[60s]))
                  > 0)
                seriesNameFormat: '{{everquest_combat_source}}'
    dps_table:
      kind: Panel
      spec:
        display:
          name: Leaderboard (DPS now / share of group)
        plugin:
          kind: TimeSeriesTable
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sort_desc(sum by (everquest_combat_source) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player"}[60s]))
                  > 0)
                seriesNameFormat: '{{everquest_combat_source}}'
    dps_history:
      kind: Panel
      spec:
        display:
          name: DPS history
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (everquest_combat_source) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player"}[30s]))
                  > 0
                seriesNameFormat: '{{everquest_combat_source}}'
    damage_mix:
      kind: Panel
      spec:
        display:
          name: Damage mix (by type)
        plugin:
          kind: PieChart
          spec:
            radius: 70
            calculation: sum
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (everquest_combat_damage_type) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player"}[60s]))
                  > 0
                seriesNameFormat: '{{everquest_combat_damage_type}}'
    dps_by_target:
      kind: Panel
      spec:
        display:
          name: Damage by target
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            mode: value
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: topk(15, sum by (everquest_combat_target) (rate(everquest_combat_damage_total{everquest_combat_direction="outgoing",
                  everquest_combat_source_type="player", everquest_group_leader=~"$group", everquest_zone_name=~"$zone", everquest_combat_source=~"$player"}[60s]))
                  > 0)
                seriesNameFormat: '{{everquest_combat_target}}'
  layouts:
  - kind: Grid
    spec:
      display:
        title: Right now
      items:
      - x: 0
        y: 0
        width: 8
        height: 4
        content:
          $ref: '#/spec/panels/stat_group_dps'
      - x: 8
        y: 0
        width: 8
        height: 4
        content:
          $ref: '#/spec/panels/stat_top_dps'
      - x: 16
        y: 0
        width: 8
        height: 4
        content:
          $ref: '#/spec/panels/stat_taken'
  - kind: Grid
    spec:
      display:
        title: Damage
      items:
      - x: 0
        y: 0
        width: 14
        height: 9
        content:
          $ref: '#/spec/panels/dps_bars'
      - x: 14
        y: 0
        width: 10
        height: 9
        content:
          $ref: '#/spec/panels/dps_table'
      - x: 0
        y: 9
        width: 16
        height: 8
        content:
          $ref: '#/spec/panels/dps_history'
      - x: 16
        y: 9
        width: 8
        height: 8
        content:
          $ref: '#/spec/panels/damage_mix'
      - x: 0
        y: 17
        width: 24
        height: 7
        content:
          $ref: '#/spec/panels/dps_by_target'
