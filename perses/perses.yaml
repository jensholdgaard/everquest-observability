# Perses server configured for Discord SSO (generic OAuth provider — no proxy/broker).
# Validated to boot with Perses v0.54.0.
#
# This file is a TEMPLATE: the ${...} values are rendered with `envsubst` at deploy time from
# GitHub Actions secrets/vars (see deploy/setup.sh). No real secrets live in git.
database:
  file:
    folder: "./data"
    extension: "json"

# Load provisioned resources (the Prometheus GlobalDatasource) at startup.
provisioning:
  # NOTE: no enable_watch — that field does not exist in Perses 0.54.0 (it is rejected at startup).
  # Provisioning is re-read on the interval below, so new members apply without a restart.
  interval: 2m
  folders:
    - /etc/perses/provisioning

security:
  enable_auth: true
  # 32-byte key that signs/encrypts session material. Generate: `openssl rand -hex 16`.
  encryption_key: "${PERSES_ENCRYPTION_KEY}"
  cookie:
    same_site: lax
    secure: ${PERSES_COOKIE_SECURE} # true behind HTTPS (prod), false for http://localhost testing

  # No blanket guest access: a logged-in stranger sees nothing. Members get the project's 'viewer'
  # role via a RoleBinding (see deploy/tokens.sh and bot/dpsbot.py).

  authentication:
    # Session length. The site's login wall (Caddy forward_auth -> whoami) checks the access token on
    # every page load and has no way to refresh it silently the way Perses's own UI does, so the
    # access token *is* the session: with the default 15m every member was bounced back through
    # Discord every quarter hour. A week, refreshable for a month.
    access_token_ttl: 168h
    refresh_token_ttl: 720h
    # Sign-up must stay open: this Perses version cannot provision an OAuth-only user (it demands a
    # native password, and adding one breaks the Discord login sync). Logging in creates the account
    # but grants nothing — access comes from a RoleBinding, provisioned per member by the bot.
    disable_sign_up: false
    providers:
      enable_native: false
      oauth:
        - slug_id: discord
          name: Discord
          client_id: "${DISCORD_CLIENT_ID}"
          client_secret: "${DISCORD_CLIENT_SECRET}"
          scopes:
            - identify
          auth_url: https://discord.com/oauth2/authorize
          token_url: https://discord.com/api/oauth2/token
          user_infos_url: https://discord.com/api/users/@me
          # Discord's /users/@me returns `username`; use it as the Perses login identity.
          custom_login_property: username
          # MUST exactly match a redirect URL registered in the Discord application.
          # Local: http://localhost:8080/...  Prod: https://<domain>/...
          redirect_uri: "${PERSES_EXTERNAL_URL}/api/auth/providers/oauth/discord/callback"
