# Jaeger v2 as a plain OTLP trace backend for the fight/zone spans Zeal emits.
# Everything binds to localhost: the gateway collector forwards traces in, Perses queries them out
# through its own proxy, and the Jaeger UI is reachable only over an SSH tunnel (no public surface,
# so no second thing to put behind Discord SSO).
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: info
    metrics:
      # Pushed to Prometheus's OTLP receiver (2026-09-06), no scrape; :18888 is gone.
      # A fixed instance id, or every restart would be a new series set.
      readers:
        - periodic:
            interval: 30000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://127.0.0.1:9090/api/v1/otlp/v1/metrics
    resource:
      attributes:
        - name: service.instance.id
          value: eq-perses
    # Jaeger's own spans went to the SDK default, localhost:4317 — Ourios, which
    # implements logs only ("traces export: rpc error: code = Unimplemented", 55 a
    # day). Off: a tracer tracing itself into itself is a loop, not observability.
    traces:
      level: none

extensions:
  jaeger_query:
    storage:
      traces: main_store
    http:
      endpoint: 127.0.0.1:16686 # UI + query API (localhost only — use an SSH tunnel)
    grpc:
      endpoint: 127.0.0.1:16685

  jaeger_storage:
    backends:
      main_store:
        badger:
          directories:
            keys: /var/lib/jaeger/keys
            values: /var/lib/jaeger/values
          ephemeral: false
          ttl:
            spans: 72h # fights are only interesting while the raid is fresh; keeps disk bounded

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14317
      http:
        endpoint: 127.0.0.1:14318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: main_store
