# Gateway OTel collector on the VM: authenticates guild members (per-member bearer tokens) and
# routes signals — metrics into the on-box Prometheus; logs to Ourios when it's ready.
# Caddy terminates TLS and proxies /otlp/* here; this listener stays on localhost.
extensions:
  # Cursor for the journal reader: after a restart it resumes where it stopped
  # instead of re-reading or skipping. The unit grants StateDirectory=eq-gateway.
  file_storage/journald:
    directory: /var/lib/eq-gateway/journald
    create_directory: true
  bearertokenauth:
    # One token per line; anything after whitespace is a comment (we put the member name there).
    # Managed with deploy/tokens.sh — add/revoke without touching this config.
    filename: /etc/eq-otel/tokens.txt

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4319
        auth:
          authenticator: bearertokenauth
        # Needed so the reporter identity Caddy injects reaches the processor below.
        include_metadata: true
      # Services on the box whose SDK only speaks OTLP/gRPC (Ourios' self-telemetry,
      # 2026-09-06). Localhost only and never proxied by Caddy, so no bearer token:
      # the same pipelines route metrics to Prometheus and traces to Jaeger.
      grpc:
        endpoint: 127.0.0.1:4321

  # --- The VM itself (2026-09-06) — nothing here is scraped by Prometheus ---------------
  # Box resources straight from /proc and /sys. The utilization gauges are what the
  # dashboard shows; the cumulative *.time counters stay for rate() if ever needed.
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: { enabled: true }
      memory:
        metrics:
          system.memory.utilization: { enabled: true }
      load:
      disk:
      filesystem:
        exclude_fs_types:
          fs_types: [tmpfs, devtmpfs, squashfs, overlay, autofs, vfat]
          match_type: strict
        metrics:
          system.filesystem.utilization: { enabled: true }
      network:
      paging:
      processes:
      system:
  # Every unit's active state as 0/1 series, plus per-service CPU/memory from cgroups
  # and the automatic-restart counter — read over D-Bus, alpha component.
  systemd:
    collection_interval: 30s
    units:
      - caddy.service
      - perses.service
      - prometheus.service
      - jaeger.service
      - ourios.service
      - eq-gateway.service
      - nocturnal.service
      - nocturnal-watchdog.service
      - fail2ban.service
      - ssh.service
      - unattended-upgrades.service
    metrics:
      systemd.service.restarts: { enabled: true }
  # Prometheus itself only speaks Prometheus: the one scrape left on the box, done here.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: prometheus
          scrape_interval: 30s
          static_configs:
            - targets: ['127.0.0.1:9090']
  # Service logs from the journal, allowlisted by unit: what a person would read when
  # something is wrong. Everything else (ssh scans, the firewall, session scopes)
  # was 97 % of the journal and is not shipped. The bot is excluded: its own
  # records already arrive over OTLP with a trace context this line would lack.
  journald/services:
    storage: file_storage/journald
    priority: info
    units:
      - caddy
      - perses
      - prometheus
      - jaeger
      - ourios
      - eq-gateway
      - nocturnal-deploy
      - nocturnal-watchdog
      - nocturnal-backup
      - fail2ban
      - ssh
      - unattended-upgrades
    operators: &journal_shape
      # The receiver delivers every journal field as a map body and sets no severity.
      # PRIORITY is the syslog level (0 emerg .. 7 debug); map it so "warnings and up"
      # means something. Then keep the message as the body and the unit as an
      # attribute, named as the systemd receiver names it.
      - type: severity_parser
        parse_from: body.PRIORITY
        if: body.PRIORITY != nil
        overwrite_text: true
        mapping:
          fatal: ["0", "1", "2"]
          error: "3"
          warn: "4"
          info: ["5", "6"]
          debug: "7"
      - type: move
        from: body._SYSTEMD_UNIT
        to: attributes["systemd.unit.name"]
        if: body._SYSTEMD_UNIT != nil
      - type: move
        from: body.SYSLOG_IDENTIFIER
        to: attributes["log.syslog.identifier"]
        if: body.SYSLOG_IDENTIFIER != nil
      - type: move
        from: body.MESSAGE
        to: body
  # systemd's own lines (unit start/stop/failure) and the kernel's, warnings and up:
  # an OOM kill or a failed unit lands here, the boot chatter does not.
  journald/system:
    storage: file_storage/journald
    priority: warning
    identifiers: [systemd, kernel]
    operators: *journal_shape

processors:
  # Stamp the member identity the gateway *knows* (from the bearer token, mapped by Caddy) over
  # anything the payload claims. A client controls its own character name, so a character name is a
  # claim; the reporter is a fact. `upsert` matters: a forged everquest.reporter in the payload is
  # overwritten rather than merged, so the attribute can always be trusted downstream.
  attributes/reporter:
    actions:
      - key: everquest.reporter
        from_context: metadata.x-eq-reporter
        action: upsert

  batch:
    timeout: 2s
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # The VM's telemetry is one service to Prometheus (job/instance) and one tenant to
  # Ourios; host.name comes from the OS. The systemd receiver's per-unit resource
  # attribute is promoted to a label by Prometheus (prometheus.yml), not renamed here.
  resource_detection:
    detectors: [system]
    system:
      hostname_sources: [os]
  resource/vm:
    attributes:
      - key: service.name
        value: eq-perses
        action: upsert
      - key: service.instance.id
        value: eq-perses
        action: upsert
  # Perses writes one access line per proxied panel query (GETs to Prometheus, POSTs
  # to Ourios) — a dashboard left open is 17k lines a day. Its access lines at info
  # are dropped whatever the method or status; warnings, errors and everything that
  # is not an access line still get through.
  filter/journal:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["systemd.unit.name"] == "perses.service" and IsMatch(body, "level=info method=[A-Z]+ status=")'
  # The two span-metrics branches below each want their own duration buckets: a PromQL
  # evaluation is milliseconds, a raid boss is minutes. So the trace stream is split by
  # who sent it; the Jaeger pipeline still sees everything.
  filter/only_fights:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] != "everquest"'
  filter/no_fights:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == "everquest"'
  # Derived metrics are the gateway's own product: one job in Prometheus, whatever the
  # spans' or lines' origin (that origin is a datapoint attribute, service_name / unit).
  resource/derived:
    attributes:
      - key: service.name
        value: eq-gateway
        action: upsert
      - key: service.instance.id
        value: eq-perses
        action: upsert

# --- Connectors (2026-09-06): signals derived from other signals inside the gateway -----
# Each is the exporter of one pipeline and the receiver of metrics/derived below.
# The metrics carry no resource attributes from their sources on purpose: a Zeal resource
# names the character (service.instance.id), and player identity never goes on a metric.
connectors:
  # Services on the box: calls and duration per span name. Prometheus's promqlEval,
  # Ourios's query plan, Caddy's request per host. Errors show up as status.code.
  span_metrics/services:
    namespace: gateway.span
    histogram:
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    exclude_dimensions: [collector.instance.id]
    resource_metrics_key_attributes: [service.name]
    aggregation_cardinality_limit: 2000
    metrics_flush_interval: 30s
  # Fights: how long the raid takes per target, and how they end. Span name is
  # `fight <target>`; two raiders on the same mob are two spans, so `calls` counts
  # raider-fights, not kills (the ledger's kill log is the deduplicated truth).
  span_metrics/fights:
    namespace: everquest.fight
    histogram:
      unit: s
      explicit:
        buckets: [10s, 20s, 30s, 45s, 60s, 90s, 2m, 3m, 5m, 8m, 12m, 20m]
    dimensions:
      - name: everquest.fight.outcome
      - name: everquest.zone.name
    exclude_dimensions: [collector.instance.id, status.code, span.kind]
    resource_metrics_key_attributes: [service.name]
    aggregation_cardinality_limit: 5000
    metrics_flush_interval: 30s
  # Journal lines at error or worse, per unit. Delta sums: Prometheus runs with
  # --enable-feature=otlp-deltatocumulative to accumulate them (deploy/setup.sh).
  count:
    logs:
      vm.journal.errors:
        description: Journal lines at error or worse, per systemd unit.
        conditions:
          - 'log.severity_number >= SEVERITY_NUMBER_ERROR'
        attributes:
          - key: systemd.unit.name
            default_value: kernel-or-systemd

exporters:
  # Metrics -> on-box Prometheus OTLP receiver.
  otlp_http/prometheus:
    metrics_endpoint: http://127.0.0.1:9090/api/v1/otlp/v1/metrics
  # Traces -> on-box Jaeger (Badger storage, 72h). Queried from Perses; UI is localhost-only.
  otlp_http/jaeger:
    traces_endpoint: http://127.0.0.1:14318/v1/traces
  # Logs are not stored. Clients don't forward them (chat contains private conversation); this
  # pipeline exists only so a stray log post gets a clean 200 instead of an error.
  # Logs -> on-box Ourios. Member clients' events (character profiles) and the
  # bot's own log records, one tenant.
  otlp_http/ourios:
    logs_endpoint: http://127.0.0.1:4318/v1/logs
    headers:
      x-ourios-tenant: nocturnal
  # The VM's own logs under their own tenant, so the guild's data stays the guild's.
  otlp_http/ourios_vm:
    logs_endpoint: http://127.0.0.1:4318/v1/logs
    headers:
      x-ourios-tenant: eq-perses
  debug:
    verbosity: basic

service:
  extensions: [bearertokenauth, file_storage/journald]
  # The collector's own metrics, pushed to Prometheus's OTLP receiver: no port 8888,
  # no scrape. A fixed instance id, or every restart would be a new series set.
  telemetry:
    resource:
      attributes:
        - name: service.instance.id
          value: eq-perses
    metrics:
      level: normal
      readers:
        - periodic:
            interval: 30000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://127.0.0.1:9090/api/v1/otlp/v1/metrics
  pipelines:
    metrics/vm:
      receivers: [host_metrics, systemd, prometheus/self]
      processors: [memory_limiter, resource_detection, resource/vm, batch]
      exporters: [otlp_http/prometheus]
    logs/journal:
      receivers: [journald/services, journald/system]
      processors: [memory_limiter, filter/journal, resource_detection, resource/vm, batch]
      exporters: [otlp_http/ourios_vm, count]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/reporter, batch]
      exporters: [otlp_http/prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/reporter, batch]
      exporters: [otlp_http/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/reporter, batch]
      exporters: [otlp_http/ourios]
    # Derived (2026-09-06): the same OTLP spans, split by sender, into the two span-metrics
    # connectors; the journal's count connector; all three land in Prometheus as one job.
    traces/services:
      receivers: [otlp]
      processors: [memory_limiter, filter/no_fights]
      exporters: [span_metrics/services]
    traces/fights:
      receivers: [otlp]
      processors: [memory_limiter, filter/only_fights]
      exporters: [span_metrics/fights]
    metrics/derived:
      receivers: [span_metrics/services, span_metrics/fights, count]
      processors: [memory_limiter, resource/derived, batch]
      exporters: [otlp_http/prometheus]
