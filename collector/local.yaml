# Local OTel collector each guild member runs. Zeal posts OTLP to it on localhost; it batches and
# forwards — metrics to the central ingest (token-authenticated), logs to Ourios (when ready).
# Zeal stays pointed at http://127.0.0.1:4318 (its default) — no credentials in the game.
#
# Run with: INGEST_TOKEN=<your token>  (see collector/run.sh)
extensions:
  # Adds "Authorization: Bearer <token>" to outgoing requests. Requires TLS on the exporter (https).
  bearertokenauth:
    token: ${env:INGEST_TOKEN}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_mib: 128

exporters:
  # Metrics -> central Prometheus ingest (Caddy /otlp -> Prometheus OTLP receiver).
  otlphttp/metrics:
    metrics_endpoint: ${env:EQ_METRICS_ENDPOINT}
    traces_endpoint: ${env:EQ_TRACES_ENDPOINT}
    auth:
      authenticator: bearertokenauth
  # Logs -> Ourios (fill in when ready). For now they're just dropped by the debug exporter.
  debug:
    verbosity: detailed

service:
  # Heartbeat: the collector reports its own health on a timer, whether or not the game is running.
  #
  # Without this, a dead collector and an idle player are indistinguishable - Zeal only posts while
  # you are in game, so silence means either "not playing" or "nothing is listening on 4318", and
  # telling those apart has taken a backend query every time. These points travel the same
  # authenticated path, so the gateway stamps them with the member identity too: the answer to
  # "whose collector is down?" arrives without anyone having to say which character they are on.
  telemetry:
    metrics:
      level: basic
      readers:
        - periodic:
            interval: 60000
            exporter:
              otlp:
                protocol: http/protobuf
                # Full URL: declarative telemetry config does NOT append /v1/metrics
                # the way OTEL_EXPORTER_OTLP_ENDPOINT does - a base URL here gets a 405.
                endpoint: ${env:EQ_METRICS_ENDPOINT}
                headers:
                  Authorization: "Bearer ${env:INGEST_TOKEN}"
  extensions: [bearertokenauth]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/metrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]   # terminates here by design — see the exporter comment above
